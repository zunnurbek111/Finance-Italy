<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinCity 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D night city; glass HUD on top, district list left, info panel right (bottom sheet on phones). Single deliberate dark look. */
*{box-sizing:border-box} body{margin:0}
:root{
  --bg:#1a1420; --surface:rgba(32,22,28,.84); --line:rgba(232,190,150,.22);
  --fg:#f6ece0; --muted:#c3a993; --gold:#e8b14a; --teal:#3fd0c0;
  --up:#4ade80; --down:#f87171;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* top bar */
#top{top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.brand h1{margin:0;font-family:var(--f-display);font-size:18px;letter-spacing:.02em;font-weight:700}
.brand h1 b{color:var(--gold);font-weight:700}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.kpis{display:flex;gap:0;flex-wrap:wrap;padding:6px 4px;min-width:0}
.kpi{padding:4px 14px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi strong{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg{font-family:var(--f-mono);font-size:11px;margin-left:4px}
.up{color:var(--up)} .down{color:var(--down)}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto;padding:6px}
button{font:inherit;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(232,177,74,.18);border-color:var(--gold);color:var(--gold)}
/* district list */
#list{left:max(16px,env(safe-area-inset-left,0px));top:118px;width:230px;max-height:calc(100% - 190px);overflow:auto;padding:10px}
#list h2,.sec-h{margin:2px 4px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
#list ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#list li button{width:100%;text-align:left;background:none;border:1px solid transparent;display:flex;gap:8px;align-items:center;padding:6px 8px}
#list li button:hover,#list li button.on{background:rgba(255,255,255,.06);border-color:var(--line)}
#list li button.on{border-color:var(--gold)}
.dot{width:9px;height:9px;border-radius:2px;flex:none}
/* info panel */
#panel{right:max(16px,env(safe-area-inset-right,0px));top:118px;width:380px;max-height:calc(100% - 150px);overflow:auto;padding:18px;
  transform:translateX(calc(100% + 40px));transition:transform .35s ease}
#panel.open{transform:none}
#panel .close{position:absolute;top:12px;right:12px;padding:4px 9px}
.p-kind{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
#panel h3{font-family:var(--f-display);font-size:19px;line-height:1.25;margin:6px 34px 8px 0;text-wrap:balance;font-weight:500}
.p-desc{color:var(--muted);line-height:1.5;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cell{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.cell small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cell b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.chart{margin:0 0 16px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.tool{border-top:1px solid var(--line);padding-top:14px}
.tool h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--teal)}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.field label output{font-family:var(--f-mono);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--gold)}
select{font:inherit;background:#2a1d24;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
.result{background:rgba(63,208,192,.08);border:1px solid rgba(63,208,192,.3);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:13px}
.result div{display:flex;justify-content:space-between;gap:10px}
.result b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:11px}
td{font-family:var(--f-mono)}
.bar{height:8px;border-radius:3px;background:var(--teal)}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
/* hint + tooltip */
#hint{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 14px;font-size:12px;color:var(--muted);white-space:nowrap}
#hint b{color:var(--fg);font-weight:500}
#tip{position:fixed;z-index:6;pointer-events:none;padding:5px 9px;font-size:12px;border-radius:6px;background:var(--surface);border:1px solid var(--gold);transform:translate(12px,12px);display:none;white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:var(--muted);z-index:10;background:var(--bg)}
@media (max-width:820px){
  #list{display:none}
  #list.show{display:block;top:auto;bottom:60px;max-height:45%;width:auto;right:max(16px,env(safe-area-inset-right,0px))}
  #panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:58%;transform:translateY(calc(100% + 40px))}
  .kpi:nth-child(n+4){display:none}
  #hint{display:none}
}
@media (min-width:821px){#btnList{display:none}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>

<div id="loading">Прокладываем каналы…</div>
<canvas id="scene" tabindex="0" aria-label="3D-модель финансового города в стиле Венеции. Перетаскивайте для вращения, колёсико для масштаба, клик по зданию открывает его панель."></canvas>

<header id="top" class="hud">
  <div class="brand glass"><h1>Fin<b>City</b> 3D</h1><span>Financial Smart City · Venezia</span></div>
  <div class="kpis glass" aria-live="polite">
    <div class="kpi"><small>Индекс FIN-30</small><strong id="kIdx">—</strong><span id="kIdxC" class="chg"></span></div>
    <div class="kpi"><small>Ключевая ставка</small><strong id="kRate">—</strong></div>
    <div class="kpi"><small>Бюджет города</small><strong id="kBud">—</strong></div>
    <div class="kpi"><small>Инфляция</small><strong id="kInf">—</strong></div>
    <div class="kpi"><small>Транзакций / сек</small><strong id="kTx">—</strong></div>
  </div>
  <div class="tools glass">
    <button id="btnList" aria-pressed="false">Объекты</button>
    <button id="btnRot" aria-pressed="false" title="Автоматический облёт 360°">Облёт 360°</button>
    <button id="btnReset" title="Вернуть камеру">Сброс</button>
  </div>
</header>

<nav id="list" class="hud glass" aria-label="Здания города">
  <h2>Ключевые объекты</h2>
  <ul id="listUl"></ul>
</nav>

<aside id="panel" class="hud glass" aria-live="polite">
  <button class="close" id="pClose" aria-label="Закрыть панель">✕</button>
  <div id="pBody"></div>
</aside>

<div id="hint" class="hud glass"><b>ЛКМ</b> — вращение · <b>колёсико</b> — зум · <b>ПКМ</b> — сдвиг · <b>клик по палаццо</b> — информация</div>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
/* ================= ECONOMY STATE ================= */
const E = {
  keyRate: 14.0,      // %
  inflation: 9.2,     // %
  idx: 1842.6, idxOpen: 1842.6, idxHist: [],
  tx: 4210,
  budget: { revenue: { 'Подоходный налог':412, 'НДС':356, 'Налог на имущество':128, 'Корпоративный налог':298, 'Неналоговые доходы':94 },
            spend:   { 'Образование':290, 'Здравоохранение':255, 'Транспорт':180, 'ЖКХ':140, 'Безопасность':120, 'Цифровизация':88, 'Обслуживание долга':64, 'Соцподдержка':170 } },
  stocks: [
    { t:'FNCB', n:'FinCity Bank', p:84.20 }, { t:'GLDT', n:'Gold Tower Invest', p:212.5 },
    { t:'PAYX', n:'PayHub Fintech', p:46.10 }, { t:'INSR', n:'SafeLife Insurance', p:63.75 },
    { t:'MALL', n:'Grand Mall REIT', p:28.40 }, { t:'ENRG', n:'City Energy', p:119.9 }
  ]
};
E.stocks.forEach(s => { s.open = s.p; s.hist = [s.p]; });
for (let i=0;i<60;i++){ E.idx += (Math.random()-.47)*6; E.idxHist.push(E.idx); }
E.idxOpen = E.idxHist[0];
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
const fmt = (n,d=0) => n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = (n,d=0) => '$' + fmt(n,d);
const mln = n => '$' + fmt(n) + ' млн';
const depositRate = () => Math.max(1, E.keyRate - 2.5);
const loanRate = () => E.keyRate + 5.5;
const mortgageRate = () => E.keyRate + 3.0;
const rnd = (a,b) => a + Math.random()*(b-a);

/* ================= UI HELPERS ================= */
function spark(data, {w=340,h=90,color='#e8b14a',fill=true}={}) {
  const min=Math.min(...data), max=Math.max(...data), pad=4, r=(max-min)||1;
  const X=i=>pad+i*(w-2*pad)/(data.length-1), Y=v=>h-pad-(v-min)/r*(h-2*pad);
  const d=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const grid=[.25,.5,.75].map(f=>`<line x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" stroke="rgba(140,190,210,.12)"/>`).join('');
  const last=data[data.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${grid}${fill?`<path d="${d} L${X(data.length-1)} ${h} L${X(0)} ${h} Z" fill="${color}" fill-opacity=".14"/>`:''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${X(data.length-1)}" cy="${Y(last)}" r="3.5" fill="${color}"/></svg>`;
}
function bars(items, {color='#3fd0c0', unit=''}={}) {
  const max=Math.max(...items.map(i=>i[1]));
  return '<table><tbody>'+items.map(([k,v,c])=>`<tr><td style="font-family:var(--f-body)">${k}</td><td style="width:45%"><div class="bar" style="width:${(v/max*100).toFixed(1)}%;background:${c||color}"></div></td><td>${fmt(v)}${unit}</td></tr>`).join('')+'</tbody></table>';
}
const series = (n, start, vol, drift=0) => { let v=start; return Array.from({length:n},()=> (v=Math.max(1,v*(1+drift+(Math.random()-.5)*vol)))); };
function field(id,label,min,max,step,val,suffix=''){ return `<div class="field"><label for="${id}">${label}<output id="${id}o">${fmt(+val, step<1?1:0)}${suffix}</output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function bindRange(root, ids, suffixes, cb){ const run=()=>{ ids.forEach((id,i)=>{ const el=root.querySelector('#'+id); const st=+el.step; root.querySelector('#'+id+'o').textContent=fmt(+el.value, st<1?1:0)+(suffixes[i]||''); }); cb(); }; ids.forEach(id=>root.querySelector('#'+id).addEventListener('input',run)); run(); }
const val = (root,id) => +root.querySelector('#'+id).value;
function annuity(P, ratePct, months){ const r=ratePct/100/12; return r? P*r/(1-Math.pow(1+r,-months)) : P/months; }

/* ================= BUILDING CATALOG ================= */
const B = [
 { id:'cb', name:'Banca Centrale — центральный банк', kind:'Монетарная политика', color:0xe8b14a, shape:'temple', x:0, z:0, w:16, d:12, h:9,
   desc:'Регулятор финансовой системы города. Устанавливает ключевую ставку, от которой зависят ставки по вкладам, кредитам и ипотеке во всех банках FinCity.',
   kpis:()=>[['Ключевая ставка',fmt(E.keyRate,1)+'%'],['Инфляция',fmt(E.inflation,1)+'%'],['Золотовалютные резервы','$4,8 млрд'],['Денежная масса M2','$21,3 млрд']],
   chart:()=>({cap:['Инфляция, 24 мес.','цель 4%'],data:series(24,11,.05,-.008),color:'#f87171'}),
   tool:{ title:'Симулятор ключевой ставки', html:()=>field('kr','Ключевая ставка',5,25,.25,E.keyRate,'%')+`<div class="result" id="krR"></div><p class="note">Ставка сразу применяется ко всему городу: смотрите на банк, кредитный центр и жилой квартал.</p>`,
     init(root){ bindRange(root,['kr'],['%'],()=>{ E.keyRate=val(root,'kr'); E.inflation=Math.max(2,Math.min(20, 9.2-(E.keyRate-14)*.55)); const credit=Math.max(-30,Math.min(30,-(E.keyRate-14)*3.2));
       root.querySelector('#krR').innerHTML=`<div><span>Прогноз инфляции через год</span><b>${fmt(E.inflation,1)}%</b></div><div><span>Ставка по вкладам</span><b>${fmt(depositRate(),1)}%</b></div><div><span>Ставка по кредитам</span><b>${fmt(loanRate(),1)}%</b></div><div><span>Ставка по ипотеке</span><b>${fmt(mortgageRate(),1)}%</b></div><div><span>Спрос на кредиты</span><b class="${credit>=0?'up':'down'}">${credit>=0?'+':''}${fmt(credit,1)}%</b></div><div><span>Реальная ставка</span><b>${fmt(E.keyRate-E.inflation,1)}%</b></div>`; updateTop(); }); } } },

 { id:'ex', name:'Borsa di San Marco — фондовая биржа FCX', kind:'Рынок капитала', color:0x3fd0c0, shape:'dome', x:-32, z:-32, w:14, d:14, h:10,
   desc:'Биржа, на которой торгуются акции компаний города. Котировки обновляются в реальном времени, индекс FIN-30 отражает настроение рынка.',
   kpis:()=>[['FIN-30',fmt(E.idx,1)],['Изм. за день',pct(E.idx,E.idxOpen)],['Капитализация','$38,6 млрд'],['Объём торгов','$412 млн']],
   chart:()=>({cap:['Индекс FIN-30, внутри дня','live'],data:E.idxHist.slice(-60),color:'#3fd0c0',live:true}),
   tool:{ title:'Котировки (обновляются каждую секунду)', html:()=>`<table><thead><tr><th>Тикер</th><th>Цена</th><th>Изм.</th></tr></thead><tbody id="tick"></tbody></table><p class="note">Модель случайного блуждания со сдвигом в зависимости от ключевой ставки: чем выше ставка, тем слабее рынок.</p>`,
     init(root){ const draw=()=>{ const tb=root.querySelector('#tick'); if(!tb) return false; tb.innerHTML=E.stocks.map(s=>`<tr><td title="${s.n}">${s.t}</td><td>${fmt(s.p,2)}</td><td class="${s.p>=s.open?'up':'down'}">${pct(s.p,s.open)}</td></tr>`).join(''); return true; }; draw(); live.push(draw); } } },

 { id:'inv', name:"Campanile d'Oro — инвестиционная компания", kind:'Инвестиции', color:0xf3d27a, shape:'tower', x:0, z:-32, w:7, d:7, h:46,
   desc:'Самая высокая колокольня города с золотым ангелом на шпиле. Управляет пенсионными и частными портфелями, помогает жителям распределять сбережения между акциями, облигациями и депозитами.',
   kpis:()=>[['Активы под управлением','$9,4 млрд'],['Клиентов','186 400'],['Доходность за год','+14,8%'],['Комиссия','1,2%']],
   chart:()=>({cap:['Стоимость активов, 5 лет','млрд $'],data:series(60,4.2,.04,.013),color:'#f3d27a'}),
   tool:{ title:'Конструктор портфеля', html:()=>field('ia','Стартовая сумма',1000,100000,1000,10000,' $')+field('im','Пополнение в месяц',0,2000,50,300,' $')+field('is','Доля акций',0,100,5,60,'%')+field('iy','Срок',1,30,1,10,' лет')+`<div class="result" id="iR"></div><div class="chart" id="iC" style="margin-top:10px"></div>`,
     init(root){ bindRange(root,['ia','im','is','iy'],[' $',' $','%',' лет'],()=>{ const a=val(root,'ia'),m=val(root,'im'),s=val(root,'is')/100,y=val(root,'iy');
       const ret=s*11+(1-s)*(depositRate()*.8), risk=s*18+(1-s)*3; let v=a, path=[a]; for(let i=1;i<=y*12;i++){ v=v*(1+ret/100/12)+m; if(i%12===0) path.push(v); }
       const put=a+m*12*y; root.querySelector('#iR').innerHTML=`<div><span>Ожидаемая доходность</span><b>${fmt(ret,1)}% год.</b></div><div><span>Риск (волатильность)</span><b>${fmt(risk,1)}%</b></div><div><span>Внесено</span><b>${money(put)}</b></div><div><span>Итоговая стоимость</span><b class="up">${money(v)}</b></div><div><span>Инвестиционный доход</span><b class="up">${money(v-put)}</b></div>`;
       root.querySelector('#iC').innerHTML=`<div class="cap"><span>Рост портфеля по годам</span><span>${y} лет</span></div>`+spark(path,{color:'#f3d27a'}); }); } } },

 { id:'bank', name:'FinCity Bank', kind:'Коммерческий банк', color:0x5aa9e6, shape:'office', x:32, z:-36, w:13, d:10, h:24,
   desc:'Крупнейший коммерческий банк: вклады, карты, переводы и расчётные счета для бизнеса. Ставки привязаны к ключевой ставке центробанка.',
   kpis:()=>[['Ставка по вкладам',fmt(depositRate(),1)+'%'],['Депозиты','$6,2 млрд'],['Кредитный портфель','$5,1 млрд'],['Достаточность капитала','13,4%']],
   chart:()=>({cap:['Чистая прибыль по кварталам','млн $'],data:[48,52,50,57,61,59,66,71,69,78],color:'#5aa9e6'}),
   tool:{ title:'Калькулятор вклада', html:()=>field('da','Сумма вклада',500,50000,500,5000,' $')+field('dt','Срок',3,60,3,12,' мес.')+`<div class="field"><label for="dc">Капитализация</label><select id="dc"><option value="12">Ежемесячно</option><option value="4">Ежеквартально</option><option value="1">В конце срока</option></select></div><div class="result" id="dR"></div>`,
     init(root){ const run=()=>{ const a=val(root,'da'),t=val(root,'dt'),c=+root.querySelector('#dc').value,r=depositRate()/100; const n=c===1?1:c*t/12; const v=c===1? a*(1+r*t/12) : a*Math.pow(1+r/c,n); const tax=Math.max(0,(v-a))*.1;

const texCache={};
function venTex(wall){
  if(texCache[wall]) return texCache[wall];
  const W=64,H=128, a=document.createElement('canvas'), e=document.createElement('canvas'); a.width=e.width=W; a.height=e.height=H;
  const g=a.getContext('2d'), ge=e.getContext('2d'); const col='#'+new THREE.Color(wall).getHexString();
  g.fillStyle=col; g.fillRect(0,0,W,H); ge.fillStyle='#000'; ge.fillRect(0,0,W,H);
  for(let i=0;i<350;i++){ g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'60,30,20'},${Math.random()*.06})`; g.fillRect(Math.random()*W,Math.random()*H,3,3); }
  for(let y=10;y<H;y+=32) for(let x=6;x<W;x+=20){
    const lit=Math.random()<.45, arch=(cx,cy,w,h,ctx)=>{ ctx.beginPath(); ctx.moveTo(cx-w/2,cy+h); ctx.lineTo(cx-w/2,cy+w/2); ctx.arc(cx,cy+w/2,w/2,Math.PI,0); ctx.lineTo(cx+w/2,cy+h); ctx.closePath(); ctx.fill(); };
    g.fillStyle='rgba(245,238,225,.9)'; arch(x+4,y-1,10,18,g);
    g.fillStyle=lit?'#ffcf87':'#2b231f'; arch(x+4,y,7,16,g);
    if(lit){ ge.fillStyle='#ffc070'; arch(x+4,y,7,16,ge); }
    if(Math.random()<.4){ g.fillStyle='#3f6b4a'; g.fillRect(x-2,y+3,2.5,13); g.fillRect(x+8.5,y+3,2.5,13); }
    g.fillStyle='rgba(240,232,215,.95)'; g.fillRect(x-2,y+16,13,2);
  }
  const t1=new THREE.CanvasTexture(a), t2=new THREE.CanvasTexture(e); [t1,t2].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; });
  return texCache[wall]={map:t1,em:t2};
}
function facadeMat(wall,w,h){
  const src=venTex(wall); const m=src.map.clone(), e=src.em.clone(); m.needsUpdate=e.needsUpdate=true;
  const rx=Math.max(1,Math.round(w/5)), ry=Math.max(1,Math.round(h/7)); m.repeat.set(rx,ry); e.repeat.set(rx,ry);
  return new THREE.MeshStandardMaterial({color:0xffffff,map:m,roughness:.85,emissive:0xffffff,emissiveMap:e,emissiveIntensity:.75});
}

function hipRoof(w,d,h,y,mat=roofMat){ const r=new THREE.Mesh(new THREE.ConeGeometry(Math.SQRT1_2,1,4),mat); r.rotation.y=Math.PI/4; r.scale.set(w*1.06,h,d*1.06); r.position.y=y+h/2; r.castShadow=true;
  const p=new THREE.Group(); p.add(r); return p; }
function chimney(x,y,z){ const g=new THREE.Group(); const s=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1.4,8),roofMat); s.position.y=.7; g.add(s);
  const f=new THREE.Mesh(new THREE.CylinderGeometry(.55,.2,.8,8),whiteStone); f.position.y=1.7; g.add(f); g.position.set(x,y,z); return g; }
function palazzo(g,wall,w,h,d,accent,x=0,z=0,opts={}){
  g.add(box(w,h,d,facadeMat(wall,w,h),x,h/2,z));
  g.add(box(w+.3,.35,d+.3,whiteStone,x,h*.33,z));             // string course
  g.add(box(w+.5,.5,d+.5,accent,x,h+.25,z));                  // cornice in the building's colour
  if(!opts.flat){ g.add(at(hipRoof(w,d,Math.min(w,d)*.32,h+.5),x,0,z));
    g.add(chimney(x-w*.3,h+.5,z+d*.2)); g.add(chimney(x+w*.28,h+.5,z-d*.25)); }
  // balcony + water door facing the camera side
  g.add(box(w*.35,.18,1,whiteStone,x,h*.55,z+d/2+.5));
  for(let i=0;i<5;i++) g.add(box(.08,.6,.08,whiteStone,x-w*.16+i*w*.08,h*.55+.38,z+d/2+.95));
}

const WALLS={cb:0xf1e4cc,ex:0xe9d6b2,inv:0xa8452f,bank:0xdb8f6b,ins:0xe3b55e,hall:0xebc3b4,tax:0xcfa27a,credit:0xc9674a,mall:0xe9c48f,fin:0xb95c4b};
function makeBuilding(b){
  const g=new THREE.Group();
  const accent=new THREE.MeshStandardMaterial({color:b.color,emissive:b.color,emissiveIntensity:.3,roughness:.45});
  const wall=b.wall||WALLS[b.id]||0xe2c49a;
  if(b.shape==='temple'){ // Palazzo Ducale style: white arcade below, pink patterned upper body, crenellations
    const hh=b.h; g.add(box(b.w,hh*.38,b.d,whiteStone,0,hh*.19,0));
    const colG=new THREE.CylinderGeometry(.35,.4,hh*.36,10);
    for(let i=0;i<9;i++){ const col=new THREE.Mesh(colG,whiteStone); col.position.set(-b.w/2+.8+i*(b.w-1.6)/8,hh*.18,b.d/2+.6); col.castShadow=true; g.add(col); }
    g.add(box(b.w+.2,.4,1.6,whiteStone,0,hh*.38,b.d/2+.4));
    g.add(box(b.w,hh*.62,b.d,facadeMat(wall,b.w,hh*.62),0,hh*.38+hh*.31,0));
    g.add(box(b.w+.4,.4,b.d+.4,accent,0,hh+.2,0));
    for(let i=0;i<b.w/1.2;i++){ g.add(box(.5,.8,.3,whiteStone,-b.w/2+.4+i*1.2,hh+.8,b.d/2)); g.add(box(.5,.8,.3,whiteStone,-b.w/2+.4+i*1.2,hh+.8,-b.d/2)); }
  } else if(b.shape==='dome'){ // basilica with five domes
    g.add(box(b.w,b.h*.6,b.d,facadeMat(wall,b.w,b.h*.6),0,b.h*.3,0));
    for(let i=0;i<5;i++) g.add(box(2,2.6,.4,new THREE.MeshStandardMaterial({color:0xd9a93a,metalness:.7,roughness:.3,emissive:0x5a3a08,emissiveIntensity:.5}),-b.w/2+1.7+i*(b.w-3.4)/4,b.h*.6-2,b.d/2+.21));
    const domeMat=new THREE.MeshStandardMaterial({color:0x8f9ea0,metalness:.5,roughness:.4,emissive:b.color,emissiveIntensity:.12});
    [[0,0,3.6],[-4,-4,2.3],[4,-4,2.3],[-4,4,2.3],[4,4,2.3]].forEach(([x,z,r])=>{ const dm=new THREE.Mesh(new THREE.SphereGeometry(r,24,12,0,Math.PI*2,0,Math.PI/2),domeMat); dm.position.set(x,b.h*.6+.6,z); dm.castShadow=true; g.add(dm);
      g.add(box(r*1.4,.6,r*1.4,whiteStone,x,b.h*.6+.3,z)); const lan=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),accent); lan.position.set(x,b.h*.6+.6+r+.3,z); g.add(lan); });
  } else if(b.shape==='tower'){ // campanile
    const sw=6.2, sh=b.h*.68; g.add(box(sw+1,2,sw+1,whiteStone,0,1,0));
    g.add(box(sw,sh,sw,new THREE.MeshStandardMaterial({color:wall,roughness:.9}),0,2+sh/2,0));
    for(let i=0;i<4;i++){ const lz=box(.5,sh,.5,new THREE.MeshStandardMaterial({color:0x8e3826,roughness:.9}),(i%2?1:-1)*sw*.18,2+sh/2,sw/2+.05); g.add(lz); g.add(box(.5,sh,.5,lz.material,sw/2+.05,2+sh/2,(i%2?1:-1)*sw*.18)); }
    const by=2+sh; g.add(box(sw+.4,.5,sw+.4,whiteStone,0,by+.25,0));
    g.add(box(sw,4,sw,whiteStone,0,by+2.5,0));
    const dark=new THREE.MeshBasicMaterial({color:0x2a1d16}); for(let i=-1;i<=1;i++){ g.add(box(1.1,2.8,.1,dark,i*1.8,by+2.4,sw/2+.01)); g.add(box(.1,2.8,1.1,dark,sw/2+.01,by+2.4,i*1.8)); }
    g.add(box(sw+.6,.6,sw+.6,accent,0,by+4.8,0));
    g.add(box(sw-.6,3,sw-.6,new THREE.MeshStandardMaterial({color:wall,roughness:.9}),0,by+6.6,0));
    const sp=new THREE.Mesh(new THREE.ConeGeometry((sw-.4)*Math.SQRT1_2,9,4),new THREE.MeshStandardMaterial({color:0x5f8f72,metalness:.3,roughness:.5})); sp.rotation.y=Math.PI/4; sp.position.y=by+12.6; sp.castShadow=true; g.add(sp);
    const angel=new THREE.Group(); const gold=new THREE.MeshStandardMaterial({color:0xf2c14e,metalness:.9,roughness:.2,emissive:0x8a5a00,emissiveIntensity:.6});
    angel.add(at(new THREE.Mesh(new THREE.ConeGeometry(.35,1.2,8),gold),0,.6,0));
    angel.add(at(new THREE.Mesh(new THREE.BoxGeometry(1.6,.1,.4),gold),0,.9,0));
    angel.position.y=by+17.1; g.add(angel); b.anim=angel;
  } else if(b.shape==='mall'){ // covered market with arcade
    g.add(box(b.w,b.h,b.d,facadeMat(wall,b.w,b.h),0,b.h/2,0));
    const colG=new THREE.CylinderGeometry(.3,.3,b.h*.45,8);
    for(let i=0;i<11;i++){ const c=new THREE.Mesh(colG,whiteStone); c.position.set(-b.w/2+.6+i*(b.w-1.2)/10,b.h*.225,b.d/2+.9); c.castShadow=true; g.add(c); }
    g.add(box(b.w+.2,.35,2,whiteStone,0,b.h*.45+.15,b.d/2+.8));
    g.add(box(b.w+.4,.4,b.d+.4,accent,0,b.h+.2,0));
    const roof=hipRoof(b.w,b.d,3,b.h+.4); g.add(roof);
    for(let i=0;i<5;i++){ const aw=box(2.6,.12,1.6,new THREE.MeshStandardMaterial({color:i%2?0xc8382c:0xf2ebdd}),-b.w/2+2.5+i*3.8,b.h*.48+.9,-b.d/2-.8); aw.rotation.x=-.35; g.add(aw); }
  } else if(b.shape==='res'){
    [[-3.5,-3.5,1,0xe6b07a],[3.5,-3.5,.8,0xd98377],[-3.5,3.5,.65,0xf0d39a],[3.5,3.5,.9,0xc96a4f]].forEach(([x,z,f,c])=>{ const hh=b.h*f; palazzo(g,c,6,hh,6,accent,x,z); });
  } else if(b.shape==='atm'){
    g.add(box(b.w,b.h,b.d,new THREE.MeshStandardMaterial({color:0x5c3a2e,roughness:.5}),0,b.h/2,0));
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(.8,.6),new THREE.MeshBasicMaterial({color:0x3fd0c0})); scr.position.set(0,b.h*.7,b.d/2+.01); g.add(scr);
    g.add(box(b.w+.3,.15,b.d+.3,accent,0,b.h+.08,0));
  } else { // office → Venetian palazzo
    palazzo(g,wall,b.w,b.h,b.d,accent);
    if(b.altana){ g.add(box(b.w*.5,.15,b.d*.4,new THREE.MeshStandardMaterial({color:0x7a5236}),0,b.h+b.w*.32+.9,0)); }
  }
  g.position.set(b.x,Q,b.z);
  g.traverse(o=>{ if(o.isMesh){ o.userData.bid=b.id; } });
  return g;
}

function labelSprite(text, sub, color){
  const c=document.createElement('canvas'); const g=c.getContext('2d'); const f1='600 44px "IBM Plex Sans", sans-serif', f2='italic 400 32px "IBM Plex Sans", sans-serif';
  g.font=f1; const w1=g.measureText(text).width; g.font=f2; const w2=g.measureText(sub).width;
  const w=Math.ceil(Math.max(w1,w2))+44, H=112; c.width=w; c.height=H;
  g.fillStyle='rgba(30,20,22,.82)'; g.strokeStyle=color; g.lineWidth=3; const r=16;
  g.beginPath(); g.moveTo(r,2); g.arcTo(w-2,2,w-2,H-2,r); g.arcTo(w-2,H-2,2,H-2,r); g.arcTo(2,H-2,2,2,r); g.arcTo(2,2,w-2,2,r); g.fill(); g.stroke();
  g.textBaseline='middle'; g.textAlign='center'; g.font=f1; g.fillStyle='#f6ece0'; g.fillText(text,w/2,38);
  g.font=f2; g.fillStyle=color; g.fillText(sub,w/2,80);
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true})); s.scale.set(w/H*3.6,3.6,1); s.renderOrder=10; return s;
}

function bridge(x,z,alongX){ const g=new THREE.Group(); const N=11, span=10;
  for(let i=0;i<N;i++){ const u=i/(N-1)-.5, y=Q+1.6*Math.cos(u*Math.PI)-.1, ang=Math.atan(-1.6*Math.PI*Math.sin(u*Math.PI)/span);
    const s=box(span/N+.12,.35,3,bridgeMat,u*span,y,0); s.rotation.z=ang; g.add(s);
    [-1.45,1.45].forEach(zz=>{ const r=box(span/N+.12,.5,.15,whiteStone,u*span,y+.4,zz); r.rotation.z=ang; g.add(r); }); }
  g.position.set(x,0,z); if(!alongX) g.rotation.y=Math.PI/2; scene.add(g); }

function setEmissive(id,on){ const g=groups[id]; if(!g) return; g.traverse(o=>{ if(o.isMesh && o.material && 'emissiveIntensity' in o.material){ if(o.userData.e0===undefined) o.userData.e0=o.material.emissiveIntensity; o.material.emissiveIntensity=on? o.userData.e0+.6 : o.userData.e0; } }); }
canvas.addEventListener('pointermove',ev=>{ if(ev.pointerType!=='mouse') return; const id=pick(ev);
  if(id!==hoverId){ if(hoverId && hoverId!==selected) setEmissive(hoverId,false); hoverId=id; if(id && id!==selected) setEmissive(id,true); canvas.style.cursor=id?'pointer':'grab'; }
  if(id){ tip.style.display='block'; tip.textContent=B.find(b=>b.id===id).name; tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; } else tip.style.display='none'; });
canvas.addEventListener('pointerdown',ev=>{ down=[ev.clientX,ev.clientY]; });
canvas.addEventListener('pointerup',ev=>{ if(!down || Math.hypot(ev.clientX-down[0],ev.clientY-down[1])>5) return; const id=pick(ev); if(id) select(id,true); });

let fly=null;
function select(id, focus){
  if(selected && selected!==id) setEmissive(selected,false);
  selected=id; setEmissive(id,true); const b=B.find(x=>x.id===id);
  sel.visible=true; sel.position.set(b.x,Q+.2,b.z); const s=Math.max(b.w,b.d)*.75+1; sel.scale.set(s,s,1);
  document.querySelectorAll('#listUl button').forEach(x=>x.classList.toggle('on',x.dataset.id===id));
  renderPanel(b);
  if(focus){ const tgt=new THREE.Vector3(b.x,Math.min(b.h*.5,14),b.z); const dir=camera.position.clone().sub(controls.target).normalize(); const dist=b.small?22:Math.max(38,b.h*1.6+20);
    fly={from:camera.position.clone(),to:tgt.clone().add(dir.multiplyScalar(dist)).setY(Math.max(14,b.h*.8+12)),tf:controls.target.clone(),tt:tgt,t:0}; }
}
const panel=document.getElementById('panel'), pBody=document.getElementById('pBody');
let chartEl=null, currentB=null;
function renderPanel(b){
  currentB=b; live.length=0;
  const ch=b.chart();
  pBody.innerHTML=`<div class="p-kind">${b.kind}</div><h3>${b.name}</h3>${engNames[b.id]?`<div style="color:var(--gold);font-style:italic;margin:-4px 0 10px">EN: ${engNames[b.id]}</div>`:''}<p class="p-desc">${b.desc}</p>
    <div class="grid" id="pK">${kpiHtml(b)}</div>
    <div class="chart"><div class="cap"><span>${ch.cap[0]}</span><span>${ch.cap[1]}</span></div><div id="pC">${spark(ch.data,{color:ch.color})}</div></div>
    ${b.tool?`<div class="tool"><h4>${b.tool.title}</h4><div id="pT">${b.tool.html()}</div></div>`:''}`;
  if(b.tool) b.tool.init(pBody.querySelector('#pT'));
  if(ch.live) live.push(()=>{ const el=pBody.querySelector('#pC'); if(!el||currentB!==b) return false; const d=b.chart(); el.innerHTML=spark(d.data,{color:d.color}); return true; });
  live.push(()=>{ const el=pBody.querySelector('#pK'); if(!el||currentB!==b) return false; el.innerHTML=kpiHtml(b); return true; });
  panel.open; panel.classList.add('open'); panel.scrollTop=0;
}
const kpiHtml=b=>b.kpis().map(([k,v])=>`<div class="cell"><small>${k}</small><b class="${/^\+/.test(v)?'up':/^−|^-\d/.test(v)?'down':''}">${v}</b></div>`).join('');
document.getElementById('pClose').onclick=()=>{ panel.classList.remove('open'); if(selected) setEmissive(selected,false); selected=null; sel.visible=false; currentB=null; live.length=0; document.querySelectorAll('#listUl button').forEach(x=>x.classList.remove('on')); };

// list
const ul=document.getElementById('listUl');
B.filter(b=>!b.filler && !b.small).forEach(b=>{ const li=document.createElement('li'); li.innerHTML=`<button data-id="${b.id}"><span class="dot" style="background:#${new THREE.Color(b.color).getHexString()}"></span><span>${shortNames[b.id]} <i style="color:var(--gold);font-size:12px">(${engNames[b.id]})</i><br><small style="color:var(--muted)">${b.kind}</small></span></button>`; ul.appendChild(li); });
ul.addEventListener('click',e=>{ const bt=e.target.closest('button'); if(!bt) return; select(bt.dataset.id,true); if(innerWidth<=820) toggleList(false); });
const listEl=document.getElementById('list'), btnList=document.getElementById('btnList');
function toggleList(v){ listEl.classList.toggle('show',v); btnList.setAttribute('aria-pressed',v); }
btnList.onclick=()=>toggleList(!listEl.classList.contains('show'));
const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.setAttribute('aria-pressed',controls.autoRotate); };
document.getElementById('btnReset').onclick=()=>{ fly={from:camera.position.clone(),to:HOME.clone(),tf:controls.target.clone(),tt:new THREE.Vector3(0,4,0),t:0}; };

/* ================= TOP KPIs + LIVE MARKET ================= */
function updateTop(){
  document.getElementById('kIdx').textContent=fmt(E.idx,1);
  const c=document.getElementById('kIdxC'); c.textContent=pct(E.idx,E.idxOpen); c.className='chg '+(E.idx>=E.idxOpen?'up':'down');
  document.getElementById('kRate').textContent=fmt(E.keyRate,2)+'%';
  const bal=sum(E.budget.revenue)-sum(E.budget.spend); const kb=document.getElementById('kBud'); kb.textContent=(bal>=0?'+':'')+mln(bal); kb.className=bal>=0?'up':'down';
  document.getElementById('kInf').textContent=fmt(E.inflation,1)+'%';
  document.getElementById('kTx').textContent=fmt(E.tx);
}
setInterval(()=>{
  const drift=(14-E.keyRate)*.0004;
  E.stocks.forEach(s=>{ s.p=Math.max(1,s.p*(1+drift+(Math.random()-.5)*.012)); s.hist.push(s.p); });
  E.idx=E.idx*(1+drift+(Math.random()-.495)*.004); E.idxHist.push(E.idx); if(E.idxHist.length>120) E.idxHist.shift();
  E.tx=Math.round(rnd(3600,4900)); txHist.push(E.tx); if(txHist.length>40) txHist.shift(); txToday+=E.tx;
  updateTop(); for(let i=live.length-1;i>=0;i--) if(live[i]()===false) live.splice(i,1);
},1000);
updateTop();

/* ================= LOOP ================= */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const clock=new THREE.Clock(); const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(fly){ fly.t=Math.min(1,fly.t+dt/1.2); const k=ease(fly.t); camera.position.lerpVectors(fly.from,fly.to,k); controls.target.lerpVectors(fly.tf,fly.tt,k); if(fly.t>=1) fly=null; }
  if(!reduce){
    animateWater(t);
    boats.forEach(o=>{ const p=o.m.position; if(o.axis==='z'){ p.z+=o.dir*o.v*dt; if(p.z>62) p.z=-62; if(p.z<-62) p.z=62; } else { p.x+=o.dir*o.v*dt; if(p.x>62) p.x=-62; if(p.x<-62) p.x=62; }
      p.y=Math.sin(t*1.6+o.ph)*.08; o.m.rotation.z=Math.sin(t*1.2+o.ph)*.04; const man=o.m.userData.man; if(man){ man.userData.oar.rotation.x=.45+Math.sin(t*1.8+o.ph)*.25; man.rotation.z=Math.sin(t*1.8+o.ph)*.08; } });
    coins.forEach(o=>{ o.c.position.y+=o.s*dt; o.c.rotation.z+=dt*3; if(o.c.position.y>Q+o.b.h+14) o.c.position.y=Q+o.b.h*.3; });
    B.forEach(b=>{ if(b.anim) b.anim.rotation.y=t*.8; });
    sel.material.opacity=.55+.35*Math.sin(t*4);
  }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(tick);
}
document.getElementById('loading').remove();
tick();
setTimeout(()=>select('cb',false),600);
})();
</script>
</body>
</html>
